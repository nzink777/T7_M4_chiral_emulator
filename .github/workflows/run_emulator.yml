name: Run T7-M4 Chiral Emulator

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 't7_m4_chiral_emulator.py'
      - 'sweep_emulator.py'
      - 'data/gel_params.json'
      - 'data/magnet_params.json'
      - 'data/sweep_params.json'
      - '.github/workflows/run_emulator.yml'
  workflow_dispatch:

jobs:
  emulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: pip install --no-cache-dir numpy

      - name: Run T7-M4 Yee 6x6 chiral emulator
        run: |
          python3 t7_m4_chiral_emulator.py \
            --gel data/gel_params.json \
            --mag data/magnet_params.json \
            --out data/emulation_results.json

      - name: Run parameter sweep and variance analysis
        run: python3 sweep_emulator.py

      - name: Print emulation and sweep metrics summary
        run: |
          python3 - <<'EOF'
          import json

          with open("data/emulation_results.json", "r", encoding="utf-8") as f:
              single = json.load(f)
          print("=== Single Run Metrics ===")
          print(json.dumps(single["metrics"], indent=2))

          with open("data/sweep_summary.json", "r", encoding="utf-8") as f:
              sweep = json.load(f)
          print(f"\n=== Sweep Summary ({sweep['total_runs']} runs) ===")
          for k, v in sweep["summary_stats"].items():
              print(f"{k}: mean={v['mean']:.6g}, var={v['variance']:.6g}, max={v['max']:.6g}")
          EOF

      - name: Commit emulation and sweep results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/emulation_results.json data/sweep_summary.json
          if git diff --staged --quiet; then
            echo "No changes in output JSON files to commit."
          else
            git commit -m "Update emulation_results.json and sweep_summary.json from GitHub Actions"
            git push
          fi

      - name: Upload emulation and sweep artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t7-m4-emulation-results
          path: |
            data/emulation_results.json
            data/sweep_summary.json
            
